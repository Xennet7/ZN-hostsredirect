name: Build Module

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ZN-hostsredirect Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Module with Gradle
        run: ./gradlew assembleRelease

      - name: Upload Built Module Zip
        uses: actions/upload-artifact@v4
        with:
          name: ZN-hostsredirect-Module
          path: |
            out/*.zip
            module/build/outputs/**/*.zip
            **/build/outputs/**/*.zip
          if-no-files-found: error

